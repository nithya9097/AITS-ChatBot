<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AITS AI Assistant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      text-align: center;
      padding: 20px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header h1 {
      font-size: 1.8rem;
      background: linear-gradient(90deg, #38bdf8, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Scrollbar */
    #chat-box::-webkit-scrollbar {
      width: 6px;
    }
    #chat-box::-webkit-scrollbar-thumb {
      background: #38bdf8;
      border-radius: 10px;
    }

    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.6;
      font-size: 0.95rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #109bdbf6, #2563eb);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom-left-radius: 4px;
    }

    .sources {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #94a3b8;
    }

    /* Typing animation */
    .typing::after {
      content: '...';
      animation: dots 1s steps(3, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    #input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(15, 23, 42, 0.7);
      color: white;
      outline: none;
      transition: 0.2s;
    }

    #user-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    button {
      padding: 12px 18px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(56,189,248,0.4);
    }
  </style>

</head>

<body>

<header>
  <h1>🎓 AITS AI Assistant</h1>
  <p>Smart College Chatbot · RAG · Gemini · LangChain</p>
</header>

<div id="chat-box">
  <div class="message bot">
    👋 Welcome! Ask me anything about admissions, courses, fees, or campus life.
  </div>
</div>

<div id="input-area">
  <input id="user-input" type="text" placeholder="Type your question..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
  const chatBox = document.getElementById("chat-box");
  const inputEl = document.getElementById("user-input");

  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  function appendMessage(text, role, sources = []) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    div.innerHTML = text.replace(/\n/g, "<br>");

    if (sources.length > 0) {
      const s = document.createElement("div");
      s.className = "sources";
      s.innerText = `📄 Sources: ${sources.join(", ")}`;
      div.appendChild(s);
    }

    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const question = inputEl.value.trim();
    if (!question) return;

    appendMessage(question, "user");
    inputEl.value = "";

    const typing = appendMessage("Thinking", "bot typing");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question })
      });

      const data = await res.json();
      typing.remove();

      if (data.error) {
        appendMessage("❌ " + data.error, "bot");
      } else {
        appendMessage(data.answer, "bot", data.sources);
      }

    } catch (err) {
      typing.remove();
      appendMessage("❌ Network error. Please try again.", "bot");
    }
  }
</script>

</body>
</html>
